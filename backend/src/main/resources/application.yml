server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: shopsphere-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopsphere_db}
    username: ${SPRING_DATASOURCE_USERNAME:shopsphere_user}
    password: ${SPRING_DATASOURCE_PASSWORD:shopsphere_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
